name: Publish CLI

# Publishes the `thirst` CLI (cli/) to PyPI with Trusted Publishing: PyPI trusts this workflow
# through GitHub's OIDC token, so no PyPI token is stored anywhere. Release by pushing a tag
# that matches cli/pyproject.toml, e.g. `git tag cli-v0.3.1 && git push origin cli-v0.3.1`.
on:
  push:
    tags: ["cli-v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag must match the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('cli/pyproject.toml','rb'))['project']['version'])")
          test "cli-v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != cli-v$version"; exit 1; }
      - name: Build the sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build cli --outdir dist
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
