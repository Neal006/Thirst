name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]" -e ./cli
      - name: Lint, types, tests, coverage
        run: make check

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build

  sam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # template.yaml arrives in plan step 05.1; until then this job passes without validating.
      - uses: actions/setup-python@v6
        if: hashFiles('template.yaml') != ''
        with:
          python-version: "3.12"
      - name: Validate SAM template
        if: hashFiles('template.yaml') != ''
        run: |
          pip install aws-sam-cli
          sam validate --lint --region ap-south-1

  secrets:
    runs-on: ubuntu-latest
    # gitleaks-action lists a PR's commits through the API, which needs pull-requests: read on a
    # private repo. If the repo ever moves to a GitHub organisation it also needs a GITLEAKS_LICENSE secret.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
