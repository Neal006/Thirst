<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" role="img" aria-label="Water is used twice: at the power plant that makes the electricity, and at the building that removes the heat" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ffffff"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#8cc6c0" stroke-width="4"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d2321"/>
    </marker>
  </defs>
  <rect width="1280" height="380" fill="#f7f8f6"/>

  <!-- power plant -->
  <rect x="40" y="40" width="340" height="300" rx="8" fill="#ffffff" stroke="#1d2321" stroke-width="1.5"/>
  <rect x="40" y="40" width="340" height="40" rx="8" fill="#1d2321"/>
  <rect x="40" y="64" width="340" height="16" fill="#1d2321"/>
  <text x="60" y="66" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#f0b43c">WATER #1 · POWER PLANT</text>
  <path d="M90 250 C100 205 100 175 92 140 L152 140 C144 175 144 205 154 250 Z" fill="#eff2ef" stroke="#1d2321" stroke-width="2"/>
  <rect x="170" y="110" width="16" height="140" fill="#eff2ef" stroke="#1d2321" stroke-width="2"/>
  <path d="M108 130 c-10 -12 6 -20 -2 -32 M124 130 c-10 -12 6 -20 -2 -32" fill="none" stroke="#8cc6c0" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="250" x2="360" y2="250" stroke="#1d2321" stroke-width="1.5"/>
  <path d="M260 120 c8 10 14 18 14 26 a14 14 0 0 1 -28 0 c0 -8 6 -16 14 -26z" fill="#126e6b"/>
  <text x="222" y="190" textLength="130" lengthAdjust="spacingAndGlyphs" font-family="Arial Narrow, Arial, sans-serif" font-size="30" font-weight="900" fill="#1d2321">≈3.25 L</text>
  <text x="222" y="212" font-family="Arial, sans-serif" font-size="14" fill="#5b6662">per kWh from coal</text>
  <text x="60" y="284" font-family="Arial, sans-serif" font-size="16" fill="#39423f">Most Indian power is coal. Coal plants</text>
  <text x="60" y="306" font-family="Arial, sans-serif" font-size="16" fill="#39423f">evaporate water to cool down.</text>
  <text x="60" y="326" font-family="Consolas, monospace" font-size="12" fill="#87918d">MoEFCC limit range 3.0 to 3.5 L/kWh</text>

  <!-- arrow electricity -->
  <line x1="390" y1="190" x2="462" y2="190" stroke="#1d2321" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="426" y="176" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#5b6662">power</text>

  <!-- GPU -->
  <rect x="470" y="40" width="340" height="300" rx="8" fill="#ffffff" stroke="#1d2321" stroke-width="1.5"/>
  <rect x="470" y="40" width="340" height="40" rx="8" fill="#126e6b"/>
  <rect x="470" y="64" width="340" height="16" fill="#126e6b"/>
  <text x="490" y="66" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#ffffff">YOUR GPU JOB</text>
  <rect x="520" y="120" width="240" height="100" rx="6" fill="#eff2ef" stroke="#1d2321" stroke-width="2"/>
  <rect x="520" y="220" width="170" height="12" fill="#f0b43c" stroke="#1d2321" stroke-width="1.5"/>
  <circle cx="590" cy="170" r="30" fill="#ffffff" stroke="#1d2321" stroke-width="2"/>
  <circle cx="680" cy="170" r="30" fill="#ffffff" stroke="#1d2321" stroke-width="2"/>
  <path d="M590 170 l0 -26 M590 170 l22 14 M590 170 l-22 14 M680 170 l0 -26 M680 170 l22 14 M680 170 l-22 14" stroke="#1d2321" stroke-width="5" stroke-linecap="round"/>
  <path d="M570 110 c-6 -9 6 -13 0 -22 M640 110 c-6 -9 6 -13 0 -22 M710 110 c-6 -9 6 -13 0 -22" fill="none" stroke="#b23a2a" stroke-width="3" stroke-linecap="round"/>
  <text x="490" y="284" font-family="Arial, sans-serif" font-size="16" fill="#39423f">Every watt a GPU uses becomes heat.</text>
  <text x="490" y="306" font-family="Arial, sans-serif" font-size="16" fill="#39423f">Thirst picks when and how fast it runs.</text>

  <!-- arrow heat -->
  <line x1="820" y1="190" x2="892" y2="190" stroke="#b23a2a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="856" y="176" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#b23a2a">heat</text>

  <!-- cooling -->
  <rect x="900" y="40" width="340" height="300" rx="8" fill="#ffffff" stroke="#1d2321" stroke-width="1.5"/>
  <rect x="900" y="40" width="340" height="40" rx="8" fill="#1d2321"/>
  <rect x="900" y="64" width="340" height="16" fill="#1d2321"/>
  <text x="920" y="66" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#f0b43c">WATER #2 · THE BUILDING</text>
  <path d="M940 250 L952 150 L1020 150 L1032 250 Z" fill="url(#hatch)" stroke="#1d2321" stroke-width="2"/>
  <path d="M966 140 c-10 -12 6 -20 -2 -32 M990 140 c-10 -12 6 -20 -2 -32" fill="none" stroke="#8cc6c0" stroke-width="3" stroke-linecap="round"/>
  <line x1="920" y1="250" x2="1220" y2="250" stroke="#1d2321" stroke-width="1.5"/>
  <text x="1056" y="180" textLength="164" lengthAdjust="spacingAndGlyphs" font-family="Arial Narrow, Arial, sans-serif" font-size="24" font-weight="900" fill="#1d2321">More on hot,</text>
  <text x="1056" y="208" textLength="150" lengthAdjust="spacingAndGlyphs" font-family="Arial Narrow, Arial, sans-serif" font-size="24" font-weight="900" fill="#1d2321">humid hours</text>
  <text x="920" y="284" font-family="Arial, sans-serif" font-size="16" fill="#39423f">Cooling towers evaporate water. Room AC</text>
  <text x="920" y="306" font-family="Arial, sans-serif" font-size="16" fill="#39423f">uses little water but more power by day.</text>
</svg>
