<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 250" width="1280" height="250" role="img" aria-label="Plan, run, receipt, rating: the Thirst loop" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d2321"/>
    </marker>
  </defs>
  <rect width="1280" height="250" fill="#f7f8f6"/>
  <g font-family="Arial, sans-serif">
    <!-- 1 plan -->
    <rect x="30" y="30" width="270" height="190" rx="8" fill="#ffffff" stroke="#1d2321" stroke-width="1.5"/>
    <text x="276" y="54" text-anchor="end" font-family="Consolas, monospace" font-size="13" fill="#87918d">01</text>
    <circle cx="80" cy="90" r="30" fill="none" stroke="#1d2321" stroke-width="3"/>
    <path d="M80 60 A30 30 0 0 1 106 75" fill="none" stroke="#126e6b" stroke-width="7"/>
    <path d="M80 90 L80 70 M80 90 L94 98" stroke="#1d2321" stroke-width="3" stroke-linecap="round"/>
    <text x="50" y="160" font-family="Arial Narrow, Arial, sans-serif" font-size="34" font-weight="900" fill="#1d2321">PLAN</text>
    <text x="50" y="190" font-size="16" fill="#5b6662">best hours + power cap</text>
    <line x1="304" y1="125" x2="336" y2="125" stroke="#1d2321" stroke-width="3" marker-end="url(#a)"/>

    <!-- 2 run -->
    <rect x="340" y="30" width="270" height="190" rx="8" fill="#ffffff" stroke="#1d2321" stroke-width="1.5"/>
    <text x="586" y="54" text-anchor="end" font-family="Consolas, monospace" font-size="13" fill="#87918d">02</text>
    <rect x="360" y="64" width="80" height="54" rx="3" fill="none" stroke="#1d2321" stroke-width="3"/>
    <rect x="384" y="76" width="9" height="30" fill="#f0b43c" stroke="#1d2321" stroke-width="2"/>
    <rect x="404" y="76" width="9" height="30" fill="#f0b43c" stroke="#1d2321" stroke-width="2"/>
    <text x="360" y="160" font-family="Arial Narrow, Arial, sans-serif" font-size="34" font-weight="900" fill="#1d2321">RUN</text>
    <text x="360" y="190" font-size="16" fill="#5b6662">waits, caps, pauses</text>
    <line x1="614" y1="125" x2="646" y2="125" stroke="#1d2321" stroke-width="3" marker-end="url(#a)"/>

    <!-- 3 receipt -->
    <rect x="650" y="30" width="270" height="190" rx="8" fill="#ffffff" stroke="#1d2321" stroke-width="1.5"/>
    <text x="896" y="54" text-anchor="end" font-family="Consolas, monospace" font-size="13" fill="#87918d">03</text>
    <path d="M674 58 h44 v64 l-7.3 -5 -7.3 5 -7.3 -5 -7.3 5 -7.3 -5 -7.5 5z" fill="none" stroke="#1d2321" stroke-width="3" stroke-linejoin="round"/>
    <path d="M684 76 h24 M684 88 h24" stroke="#1d2321" stroke-width="3"/>
    <path d="M684 102 h14" stroke="#126e6b" stroke-width="5"/>
    <text x="670" y="160" font-family="Arial Narrow, Arial, sans-serif" font-size="34" font-weight="900" fill="#1d2321">RECEIPT</text>
    <text x="670" y="190" font-size="16" fill="#5b6662">measured from the GPU, signed</text>
    <line x1="924" y1="125" x2="956" y2="125" stroke="#1d2321" stroke-width="3" marker-end="url(#a)"/>

    <!-- 4 rating -->
    <rect x="960" y="30" width="290" height="190" rx="8" fill="#ffffff" stroke="#1d2321" stroke-width="2.5"/>
    <rect x="964" y="214" width="290" height="10" fill="#f0b43c"/>
    <text x="1226" y="54" text-anchor="end" font-family="Consolas, monospace" font-size="13" fill="#87918d">04</text>
    <path d="M980 122 h80" stroke="#1d2321" stroke-width="3"/>
    <rect x="984" y="94" width="20" height="28" fill="none" stroke="#1d2321" stroke-width="3"/>
    <rect x="1010" y="70" width="20" height="52" fill="#f0b43c" stroke="#1d2321" stroke-width="3"/>
    <rect x="1036" y="102" width="20" height="20" fill="none" stroke="#1d2321" stroke-width="3"/>
    <text x="980" y="160" font-family="Arial Narrow, Arial, sans-serif" font-size="34" font-weight="900" fill="#1d2321">RATING</text>
    <text x="980" y="190" font-size="16" fill="#5b6662">fair, against labs your size</text>
  </g>
</svg>
