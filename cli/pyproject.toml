[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "thirst"
version = "0.3.0"
description = "Thirst CLI: plan, run and measure GPU jobs for water and carbon."
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "nvidia-ml-py>=12",
  "httpx>=0.27",
  "tomli>=2; python_version < '3.11'",
  "tomli-w>=1",
]

[project.optional-dependencies]
sweep = ["torch", "torchvision"]

[project.scripts]
thirst = "thirst.__main__:main"

[tool.setuptools.packages.find]
include = ["thirst*"]

[tool.setuptools.package-data]
thirst = ["data/*.json"]
